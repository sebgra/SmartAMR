[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "SmartAMR"
version = "0.1.0"
description = "Predicting phage-host interaction from protein language model embeddings"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "sebgra" }]
keywords = ["bioinformatics", "bacteriophage", "antimicrobial-resistance", "esm"]

# The core install is what the CLI needs to select, filter, pair and train.
# Embedding and the web app are extras, because torch and streamlit are large
# and plenty of uses of this package need neither.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "biopython>=1.83",
    "requests>=2.31",
    "joblib>=1.3",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
# ESM-C embeddings. Install a CUDA build of torch first if you want the GPU:
#   pip install torch --index-url https://download.pytorch.org/whl/cu124
embed = ["torch>=2.2", "esm>=3.1"]
app = ["streamlit>=1.40", "altair>=5.2"]
figures = ["matplotlib>=3.8", "seaborn>=0.13"]
dev = ["pytest>=8.0"]
# Kept so `pip install -e ".[dashboard]"` from older notes still resolves; the
# dashboard was merged into the app, so it installs the same thing.
dashboard = ["streamlit>=1.40", "altair>=5.2"]
all = [
    "torch>=2.2",
    "esm>=3.1",
    "streamlit>=1.40",
    "altair>=5.2",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.scripts]
smartamr = "SmartAMR.cli:main"

[project.urls]
Homepage = "https://github.com/sebgra/SmartAMR"

[tool.hatch.build.targets.wheel]
packages = ["SmartAMR"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "W"]
ignore = [
    # extract_AMR_genes_names and friends keep their original names so the
    # notebooks that call them keep working.
    "N802",
    # The package directory is SmartAMR, which is the published import name.
    "N999",
    # MemoryBudgetExceeded subclasses MemoryError; "...Error" would stutter.
    "N818",
]

[tool.pytest.ini_options]
# Only tests/ holds tests. prototypes/ has scratch scripts whose names begin
# with "test_" (test_cuda.py checks a GPU is visible); collecting those as
# tests makes a bare `pytest` fail on an import error.
testpaths = ["tests"]
addopts = "-q"
